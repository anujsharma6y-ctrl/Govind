<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,400&display=swap');

    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #060713;
      color: #f8fafc;
      overflow: hidden;
      touch-action: manipulation;
    }

    .font-serif-title {
      font-family: 'Playfair Display', serif;
    }

    /* Glass card styling */
    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(245, 158, 11, 0.22);
    }

    /* 3D Door Animation */
    .door-perspective {
      perspective: 1200px;
    }
    .door-panel {
      transform-origin: left center;
      transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .door-open {
      transform: rotateY(-112deg);
    }

    /* Candle Flame Flicker */
    @keyframes flame-flicker {
      0%, 100% { transform: scale(1) rotate(-1deg); filter: drop-shadow(0 0 7px #f59e0b); }
      50% { transform: scale(1.18) rotate(2deg); filter: drop-shadow(0 0 13px #fbbf24); }
    }
    .flame-active {
      animation: flame-flicker 0.6s infinite alternate ease-in-out;
    }

    /* Balloon Float Animation */
    @keyframes gentle-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(3deg); }
    }
    .floating-balloon {
      animation: gentle-float 3s infinite ease-in-out;
    }

    /* Shake animation for wrong inputs */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .shake-anim {
      animation: shake 0.4s ease-in-out;
    }
  </style>
</head>
<body class="w-screen h-screen relative bg-[#060713] text-slate-100 flex flex-col justify-between p-4 overflow-hidden">

  <script>
    /* ====================================================================

       ==================================================================== */
    const birthdayConfig = {

      age: 21,

    /* ====================================================================
       2. ERROR-SAFE AUDIO ENGINE
       ==================================================================== */
    const bgAudio = document.getElementById('bg-audio');
    let isSoundOn = false;
    let sfxCtx = null;

    function initSFX() {
      try {
        if (!sfxCtx) {
          sfxCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (sfxCtx && sfxCtx.state === 'suspended') {
          sfxCtx.resume();
        }
      } catch (e) {
        console.warn("AudioContext skipped", e);
      }
    }

    function playTone(freq, type = 'sine', duration = 0.2, vol = 0.15) {
      if (!isSoundOn || !sfxCtx) return;
      try {
        const osc = sfxCtx.createOscillator();
        const gain = sfxCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, sfxCtx.currentTime);
        gain.gain.setValueAtTime(vol, sfxCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, sfxCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(sfxCtx.destination);
        osc.start();
        osc.stop(sfxCtx.currentTime + duration);
      } catch (e) {}
    }

    function sfxPop() { playTone(650 + Math.random() * 200, 'triangle', 0.12, 0.2); }
    function sfxCorrect() {
      playTone(523.25, 'sine', 0.15, 0.2);
      setTimeout(() => playTone(659.25, 'sine', 0.15, 0.2), 100);
      setTimeout(() => playTone(783.99, 'sine', 0.25, 0.25), 200);
    }
    function sfxWrong() { playTone(220, 'sawtooth', 0.25, 0.12); }
    function sfxBlow() { playTone(300, 'triangle', 0.15, 0.08); }
    function sfxGrand() {
      playTone(440, 'triangle', 0.25, 0.2);
      setTimeout(() => playTone(554.37, 'triangle', 0.25, 0.2), 140);
      setTimeout(() => playTone(659.25, 'triangle', 0.25, 0.2), 280);
      setTimeout(() => playTone(880, 'triangle', 0.5, 0.25), 420);
    }

    function startMusic() {
      initSFX();
      isSoundOn = true;
      const statusEl = document.getElementById('sound-status');
      const iconEl = document.getElementById('sound-icon');
      if (statusEl) statusEl.innerText = "Sound On";
      if (iconEl) iconEl.innerText = "🔊";
      
      if (bgAudio) {
        const p = bgAudio.play();
        if (p !== undefined) {
          p.catch(err => console.log("Autoplay deferred:", err));
        }
      }
    }

    function pauseMusic() {
      isSoundOn = false;
      const statusEl = document.getElementById('sound-status');
      const iconEl = document.getElementById('sound-icon');
      if (statusEl) statusEl.innerText = "Sound Off";
      if (iconEl) iconEl.innerText = "🔈";
      if (bgAudio) bgAudio.pause();
    }

    document.getElementById('sound-btn').addEventListener('click', () => {
      if (isSoundOn) {
        pauseMusic();
      } else {
        startMusic();
      }
    });

    /* ====================================================================
       3. CANVAS FIREWORKS
       ==================================================================== */
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let fireworksParticles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function launchFireworks() {
      for (let i = 0; i < 35; i++) {
        const x = canvas.width * 0.2 + Math.random() * canvas.width * 0.6;
        const y = canvas.height * 0.15 + Math.random() * canvas.height * 0.35;
        const colors = ['#f59e0b', '#fbbf24', '#ec4899', '#8b5cf6', '#3b82f6', '#10b981'];
        const color = colors[Math.floor(Math.random() * colors.length)];
        
        for (let j = 0; j < 22; j++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 1.8 + Math.random() * 4.2;
          fireworksParticles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            alpha: 1,
            color
          });
        }
      }
    }

    function renderFireworks() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = fireworksParticles.length - 1; i >= 0; i--) {
        const p = fireworksParticles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.alpha -= 0.016;
        if (p.alpha <= 0) {
          fireworksParticles.splice(i, 1);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.alpha;
          ctx.fill();
        }
      }
      ctx.globalAlpha = 1;
      requestAnimationFrame(renderFireworks);
    }
    renderFireworks();

    /* ====================================================================
       4. SCENE CONTROLLER (Zero Chapter numbers displayed)
       ==================================================================== */
    let currentScene = 1;
    const container = document.getElementById('app-container');

    function updateScene(num) {
      currentScene = num;
      container.innerHTML = '';

      switch (num) {
        case 1: renderScene1(); break;
        case 2: renderScene2(); break;
        case 3: renderScene3(); break;
        case 4: renderScene4(); break;
        case 5: renderScene5(); break;
        case 6: renderScene6(); break;
        case 7: renderScene7(); break;
        case 8: renderScene8(); break;
      }
    }

    /* SCENE 1: THE SECRET BIRTHDAY DOOR */
    function renderScene1() {
      container.innerHTML = `
        <div class="text-center w-full px-4 flex flex-col items-center">

          <div class="door-perspective relative w-44 h-64 mx-auto mb-6 bg-amber-950/20 border-2 border-amber-500/30 rounded-t-full p-2 flex items-center justify-center overflow-hidden shadow-[0_0_35px_rgba(245,158,11,0.2)]">
            <div id="door-light" class="absolute inset-0 bg-gradient-to-t from-amber-400/50 via-yellow-300/30 to-transparent opacity-0 transition-opacity duration-1000"></div>
            
            <div id="door-panel" class="door-panel relative w-full h-full bg-gradient-to-br from-amber-900 via-amber-950 to-stone-950 border border-amber-500/50 rounded-t-full flex flex-col items-center justify-center shadow-2xl cursor-pointer">
              <div class="w-9 h-9 rounded-full border border-amber-400/60 flex items-center justify-center text-amber-300 text-sm font-bold mb-4 shadow-[0_0_10px_rgba(245,158,11,0.3)]">21</div>
              <div class="w-3 h-3 rounded-full bg-amber-400 shadow-[0_0_10px_#f59e0b] ml-16"></div>
              <span class="text-[10px] tracking-widest text-amber-300 font-mono mt-7 uppercase font-semibold">TAP TO OPEN</span>
            </div>
          </div>

          <button id="open-door-btn" class="w-full max-w-xs py-3.5 px-6 rounded-2xl bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 text-slate-950 font-bold text-sm tracking-wide shadow-lg shadow-amber-500/20 active:scale-95 transition-all">
            OPEN YOUR SURPRISE 🎵
          </button>
        </div>
      `;

      const doorBtn = document.getElementById('open-door-btn');
      const doorPanel = document.getElementById('door-panel');
      const doorLight = document.getElementById('door-light');
      let unlocked = false;

      function unlock() {
        if (unlocked) return;
        unlocked = true;

        try { startMusic(); } catch(e) {}
        try { sfxGrand(); } catch(e) {}

        if (doorPanel) doorPanel.classList.add('door-open');
        if (doorLight) {
          doorLight.classList.remove('opacity-0');
          doorLight.classList.add('opacity-100');
        }

        try {
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 50,
              spread: 70,
              origin: { y: 0.6 }
            });
          }
        } catch(e) {}

        setTimeout(() => {
          updateScene(2);
        }, 1200);
      }

      if (doorBtn) doorBtn.addEventListener('click', unlock);
      if (doorPanel) doorPanel.addEventListener('click', unlock);
    }

    /* SCENE 2: BIRTHDAY BRAIN TEST */
    function renderScene2() {
      container.innerHTML = `
        <div class="text-center w-full px-4 flex flex-col items-center">
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400 mb-1">Identity Verification</span>
          <h2 class="text-2xl font-serif-title font-bold text-slate-100 mb-1">Are you truly Govind?</h2>
          <p class="text-xs text-slate-400 mb-6">Solve this high-level mathematics equation:</p>

          <div id="math-card" class="glass-card w-full max-w-xs rounded-3xl p-6 mb-4 text-center">
            <div class="text-4xl font-bold tracking-wider text-amber-300 mb-5 font-mono">2 + 2 = ?</div>
            
            <div class="grid grid-cols-2 gap-3">
              <button class="answer-btn py-3 rounded-xl bg-white/5 border border-slate-700 text-lg font-bold active:bg-amber-500/20 transition-colors" data-val="2">2</button>
              <button class="answer-btn py-3 rounded-xl bg-white/5 border border-slate-700 text-lg font-bold active:bg-amber-500/20 transition-colors" data-val="3">3</button>
              <button class="answer-btn py-3 rounded-xl bg-white/5 border border-slate-700 text-lg font-bold active:bg-amber-500/20 transition-colors" data-val="4">4</button>
              <button class="answer-btn py-3 rounded-xl bg-white/5 border border-slate-700 text-lg font-bold active:bg-amber-500/20 transition-colors" data-val="5">5</button>
            </div>

            <p id="feedback-msg" class="text-xs mt-4 text-amber-400 font-medium h-5"></p>
          </div>
        </div>
      `;

      const buttons = document.querySelectorAll('.answer-btn');
      const card = document.getElementById('math-card');
      const feedback = document.getElementById('feedback-msg');

      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const val = btn.getAttribute('data-val');
          if (val === "4") {
            try { sfxCorrect(); } catch(e) {}
            if (feedback) feedback.innerText = "Correct! The birthday brain is razor sharp! 🎈";
            btn.classList.add('bg-emerald-500/30', 'border-emerald-400', 'text-emerald-300');
            try { confetti({ particleCount: 40, spread: 60 }); } catch(e) {}
            setTimeout(() => {
              updateScene(3);
            }, 1000);
          } else {
            try { sfxWrong(); } catch(e) {}
            if (feedback) feedback.innerText = "Are you sure? 😂 Try again!";
            if (card) {
              card.classList.remove('shake-anim');
              void card.offsetWidth;
              card.classList.add('shake-anim');
            }
          }
        });
      });
    }

    /* SCENE 3: POP 7 BALLOONS */
    function renderScene3() {
      const messages = [
        "Officially turning 21!",
        "Shaadi swag & royal pagdis.",
        "Brotherhood for life.",
        "Unstoppable ambition.",
        "Unforgettable moments.",
        "Endless reasons to smile.",
        "Only the beginning..."
      ];
      const colors = ['#ec4899', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#06b6d4'];
      let popped = 0;

      container.innerHTML = `
        <div class="text-center w-full px-4 flex flex-col items-center">
          <span class="text-xs font-semibold uppercase tracking-wider text-amber-400 mb-1">Warm-up Mission</span>
          <h2 class="text-2xl font-serif-title font-bold text-slate-100 mb-1">Pop All 7 Balloons</h2>
          <p class="text-xs text-slate-400 mb-3">Tap every balloon to unlock secret messages</p>

          <div id="balloon-area" class="relative w-full max-w-xs h-80 glass-card rounded-3xl p-4 overflow-hidden border border-white/10 flex items-center justify-center"></div>

          <div id="balloon-display" class="h-6 mt-3 text-xs font-semibold text-amber-300"></div>
        </div>
      `;

      const area = document.getElementById('balloon-area');
      const display = document.getElementById('balloon-display');

      messages.forEach((msg, idx) => {
        const b = document.createElement('div');
        const color = colors[idx % colors.length];
        const left = 10 + (idx % 3) * 32 + (Math.random() * 6 - 3);
        const top = 12 + Math.floor(idx / 3) * 30 + (Math.random() * 6 - 3);

        b.className = "floating-balloon absolute w-14 h-18 cursor-pointer flex flex-col items-center justify-center active:scale-90 transition-transform";
        b.style.left = `${left}%`;
        b.style.top = `${top}%`;
        b.style.animationDelay = `${idx * 0.35}s`;

        b.innerHTML = `
          <div class="w-12 h-14 rounded-full shadow-lg relative flex items-center justify-center" style="background: radial-gradient(circle at 35% 30%, #fff, ${color})">
            <span class="text-[10px] font-extrabold text-white/95">${idx + 1}</span>
          </div>
          <div class="w-0.5 h-3 bg-white/40"></div>
        `;

        b.addEventListener('click', () => {
          try { sfxPop(); } catch(e) {}
          if (display) display.innerText = `"${msg}"`;
          b.style.transform = 'scale(0)';
          b.style.opacity = '0';
          b.style.pointerEvents = 'none';
          popped++;

          try {
            confetti({
              particleCount: 15,
              spread: 40,
              origin: { x: (b.offsetLeft + 20) / window.innerWidth, y: (b.offsetTop + 100) / window.innerHeight }
            });
          } catch(e) {}

          if (popped === messages.length) {
            try { sfxGrand(); } catch(e) {}
            try { confetti({ particleCount: 75, spread: 80 }); } catch(e) {}
