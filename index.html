<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050509">
<meta name="description" content="Govind's 21st Birthday Experience">

<title>Govind Turns 21 🎂</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,190,70,.08), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(255,90,120,.08), transparent 30%),
        #050509;
    color: #fff;
    font-family: Georgia, "Times New Roman", serif;
}

button {
    font: inherit;
}

button:focus-visible {
    outline: 3px solid #ffd166;
    outline-offset: 4px;
}

/* =========================================================
   BACKGROUND
========================================================= */

#background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.star {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #fff;
    opacity: .5;
    animation: twinkle 3s infinite ease-in-out;
}

@keyframes twinkle {
    0%,100% {
        opacity: .15;
        transform: scale(.7);
    }

    50% {
        opacity: 1;
        transform: scale(1.4);
    }
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 62px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    z-index: 500;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,.65),
        transparent
    );
}

.logo {
    font-size: 18px;
    letter-spacing: 3px;
    color: #ffd166;
    text-transform: uppercase;
}

.sound-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    backdrop-filter: blur(10px);
    transition: .3s;
}

.sound-btn:hover {
    transform: scale(1.1);
    background: rgba(255,209,102,.2);
}

/* =========================================================
   SCENE SYSTEM
========================================================= */

#app {
    position: relative;
    width: 100%;
    height: 100vh;
    z-index: 2;
}

.scene {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 80px 20px 30px;
    overflow-y: auto;
}

.scene.active {
    display: flex;
    animation: sceneIn .8s ease both;
}

@keyframes sceneIn {
    from {
        opacity: 0;
        transform: scale(1.03);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.scene-content {
    width: min(1100px, 100%);
    text-align: center;
    position: relative;
    z-index: 10;
}

/* =========================================================
   TYPOGRAPHY
========================================================= */

.kicker {
    color: #ffd166;
    text-transform: uppercase;
    letter-spacing: 5px;
    font-size: 13px;
    margin-bottom: 15px;
}

.title {
    font-size: clamp(45px, 9vw, 105px);
    line-height: .95;
    margin-bottom: 25px;
    background: linear-gradient(
        90deg,
        #fff,
        #ffd166,
        #fff,
        #f6b73c
    );
    background-size: 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: goldFlow 6s linear infinite;
}

@keyframes goldFlow {
    from {
        background-position: 0%;
    }

    to {
        background-position: 300%;
    }
}

.subtitle {
    max-width: 650px;
    margin: auto;
    color: #c9c9d2;
    font-family: Arial, sans-serif;
    line-height: 1.7;
    font-size: 16px;
}

.big-number {
    font-size: clamp(100px, 22vw, 260px);
    line-height: .8;
    font-weight: bold;
    color: #ffd166;
    text-shadow:
        0 0 20px rgba(255,209,102,.5),
        0 0 70px rgba(255,180,40,.3);
}

/* =========================================================
   BUTTONS
========================================================= */

.primary-btn,
.secondary-btn {
    position: relative;
    margin: 25px 8px 0;
    padding: 15px 30px;
    border-radius: 999px;
    cursor: pointer;
    transition: .35s;
    font-weight: bold;
    letter-spacing: 1px;
}

.primary-btn {
    border: 1px solid #ffd166;
    background: linear-gradient(
        135deg,
        #ffd166,
        #e9a928
    );
    color: #17120a;
    box-shadow:
        0 10px 40px rgba(255,190,60,.2);
}

.secondary-btn {
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.06);
    color: white;
}

.primary-btn:hover,
.secondary-btn:hover {
    transform: translateY(-5px) scale(1.03);
}

.primary-btn:active,
.secondary-btn:active {
    transform: scale(.96);
}

/* =========================================================
   SCENE 1 - DOOR
========================================================= */

.door-area {
    width: min(430px, 90vw);
    height: 530px;
    margin: 25px auto;
    position: relative;
    perspective: 1200px;
}

.door-frame {
    position: absolute;
    inset: 0;
    border: 12px solid #4c3218;
    border-bottom-width: 18px;
    background: #130d08;
    box-shadow:
        0 0 0 4px #c88c32,
        0 30px 80px rgba(0,0,0,.7);
}

.door {
    position: absolute;
    inset: 10px;
    transform-origin: left center;
    transition: transform 1.2s cubic-bezier(.2,.8,.2,1);
    background:
        linear-gradient(
            90deg,
            #2c1a0e,
            #4a2b13,
            #2a170b
        );
    border: 4px solid #8e6027;
    z-index: 5;
}

.door.open {
    transform: rotateY(-105deg);
}

.door-panel {
    position: absolute;
    left: 35px;
    right: 35px;
    top: 35px;
    bottom: 35px;
    border: 3px solid rgba(255,209,102,.5);
}

.door-panel::before,
.door-panel::after {
    content: "";
    position: absolute;
    left: 35px;
    right: 35px;
    height: 120px;
    border: 2px solid rgba(255,209,102,.35);
}

.door-panel::before {
    top: 35px;
}

.door-panel::after {
    bottom: 35px;
}

.door-handle {
    position: absolute;
    right: 30px;
    top: 50%;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: #ffd166;
    box-shadow: 0 0 15px rgba(255,209,102,.5);
}

.door-label {
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 80%;
}

.door-label strong {
    display: block;
    color: #ffd166;
    font-size: 30px;
    letter-spacing: 5px;
}

.door-label span {
    display: block;
    margin-top: 10px;
    color: white;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
}

/* =========================================================
   SCENE 2 - MATH
========================================================= */

.challenge-card {
    width: min(650px, 95vw);
    margin: auto;
    padding: 45px 25px;
    border: 1px solid rgba(255,255,255,.15);
    border-radius: 30px;
    background: rgba(255,255,255,.05);
    backdrop-filter: blur(18px);
    box-shadow: 0 30px 100px rgba(0,0,0,.3);
}

.math-question {
    font-size: clamp(55px, 12vw, 100px);
    color: #fff;
    margin: 25px 0;
}

.answer-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    max-width: 500px;
    margin: auto;
}

.answer-btn {
    min-height: 80px;
    border-radius: 18px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(255,255,255,.06);
    color: white;
    font-size: 25px;
    cursor: pointer;
    transition: .3s;
}

.answer-btn:hover {
    background: rgba(255,209,102,.2);
    transform: translateY(-6px);
}

.feedback {
    min-height: 30px;
    margin-top: 20px;
    color: #ffd166;
    font-family: Arial, sans-serif;
}

/* =========================================================
   SCENE 3 - BALLOONS
========================================================= */

.balloon-area {
    min-height: 480px;
    position: relative;
    margin: 20px auto;
    max-width: 950px;
}

.balloon {
    position: absolute;
    width: 75px;
    height: 95px;
    border-radius: 50% 50% 45% 45%;
    border: 0;
    cursor: pointer;
    box-shadow:
        inset -10px -10px 15px rgba(0,0,0,.2),
        0 10px 25px rgba(0,0,0,.3);
    transition: transform .2s;
}

.balloon:hover {
    transform: scale(1.08);
}

.balloon::after {
    content: "";
    position: absolute;
    width: 1px;
    height: 160px;
    background: rgba(255,255,255,.5);
    left: 50%;
    top: 95%;
}

.balloon::before {
    content: "";
    position: absolute;
    width: 10px;
    height: 10px;
    background: inherit;
    bottom: -4px;
    left: calc(50% - 5px);
    transform: rotate(45deg);
}

.balloon.popped {
    animation: pop .45s ease forwards;
    pointer-events: none;
}

@keyframes pop {
    0% {
        transform: scale(1);
        opacity: 1;
    }

    50% {
        transform: scale(1.4);
    }

    100% {
        transform: scale(.05);
        opacity: 0;
    }
}

.b1 { left: 8%; top: 20%; background: #ef476f; }
.b2 { left: 27%; top: 5%; background: #06d6a0; }
.b3 { left: 48%; top: 17%; background: #ffd166; }
.b4 { left: 70%; top: 3%; background: #118ab2; }
.b5 { left: 17%; top: 52%; background: #9b5de5; }
.b6 { left: 53%; top: 57%; background: #f15bb5; }
.b7 { left: 78%; top: 52%; background: #00bbf9; }

.balloon-counter {
    font-family: Arial, sans-serif;
    color: #bbb;
}

.balloon-counter strong {
    color: #ffd166;
}

/* =========================================================
   SCENE 4 - MEMORY GALLERY
========================================================= */

.memory-wrap {
    max-width: 950px;
    margin: auto;
}

.photo-card {
    position: relative;
    width: min(700px, 95vw);
    margin: auto;
    min-height: 500px;
    border-radius: 28px;
    overflow: hidden;
    background: #111;
    border: 1px solid rgba(255,255,255,.15);
    box-shadow: 0 30px 100px rgba(0,0,0,.5);
}

.photo-card img {
    width: 100%;
    height: 500px;
    object-fit: cover;
    display: block;
    transition: opacity .4s, transform .7s;
}

.photo-card.changing img {
    opacity: .2;
    transform: scale(1.05);
}

.photo-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 60px 25px 25px;
    text-align: left;
    background: linear-gradient(
        transparent,
        rgba(0,0,0,.95)
    );
}

.photo-caption h3 {
    font-size: 28px;
    color: #ffd166;
}

.photo-caption p {
    margin-top: 8px;
    color: #ddd;
    font-family: Arial, sans-serif;
}

.photo-count {
    margin-top: 15px;
    color: #aaa;
    font-family: Arial, sans-serif;
}

.gallery-controls {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 20px;
}

.circle-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.25);
    background: rgba(255,255,255,.08);
    color: white;
    cursor: pointer;
    font-size: 20px;
}

/* =========================================================
   SCENE 5 - AGE CHALLENGE
========================================================= */

.age-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    max-width: 800px;
    margin: 40px auto 0;
}

.age-card {
    min-height: 180px;
    border-radius: 25px;
    border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.05);
    color: white;
    cursor: pointer;
    transition: .35s;
}

.age-card span {
    display: block;
    font-size: 65px;
    color: #ffd166;
}

.age-card small {
    display: block;
    margin-top: 10px;
    font-family: Arial, sans-serif;
    color: #aaa;
}

.age-card:hover {
    transform: translateY(-10px) rotateX(5deg);
    background: rgba(255,209,102,.12);
}

.age-card.correct {
    border-color: #06d6a0;
    box-shadow: 0 0 40px rgba(6,214,160,.2);
}

.age-card.wrong {
    animation: shake .4s;
    border-color: #ef476f;
}

@keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
}

/* =========================================================
   SCENE 6 - CANDLES
========================================================= */

.candle-zone {
    max-width: 900px;
    margin: auto;
}

.candle-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 12px;
    max-width: 700px;
    margin: 30px auto;
    padding: 20px;
}

.candle {
    height: 100px;
    position: relative;
    border: 0;
    cursor: pointer;
    background: transparent;
}

.candle-body {
    position: absolute;
    width: 22px;
    height: 65px;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    border-radius: 5px;
    background:
        repeating-linear-gradient(
            0deg,
            #f7e2a8 0 10px,
            #d89b35 10px 13px
        );
    box-shadow: 0 5px 15px rgba(0,0,0,.4);
}

.flame {
    position: absolute;
    left: 50%;
    top: 0;
    width: 20px;
    height: 30px;
    transform: translateX(-50%);
    background: #ffd166;
    border-radius: 50% 50% 50% 10%;
    transform-origin: bottom;
    animation: flame .55s infinite alternate;
    box-shadow:
        0 0 12px #ffd166,
        0 0 30px rgba(255,150,30,.8);
}

@keyframes flame {
    from {
        transform: translateX(-50%) rotate(-4deg) scale(.9);
    }

    to {
        transform: translateX(-50%) rotate(4deg) scale(1.1);
    }
}

.candle.blown .flame {
    display: none;
}

.candle.blown .candle-body {
    opacity: .65;
}

.candle-count {
    color: #bbb;
    font-family: Arial, sans-serif;
}

.candle-count strong {
    color: #ffd166;
    font-size: 24px;
}

/* =========================================================
   SCENE 7 - LETTER
========================================================= */

.letter-scene {
    width: min(850px, 95vw);
    margin: auto;
}

.envelope {
    width: min(720px, 95vw);
    min-height: 420px;
    margin: auto;
    position: relative;
    background: #d8b77b;
    color: #281b0d;
    border-radius: 12px;
    padding: 50px;
    box-shadow:
        0 40px 100px rgba(0,0,0,.5),
        inset 0 0 50px rgba(100,60,10,.15);
    transform-style: preserve-3d;
    transition: .8s;
}

.envelope.sealed {
    cursor: pointer;
}

.envelope.sealed:hover {
    transform: translateY(-8px) rotateX(3deg);
}

.wax-seal {
    width: 75px;
    height: 75px;
    border-radius: 50%;
    background: #8b1e2d;
    color: #ffd166;
    display: grid;
    place-items: center;
    margin: 0 auto 30px;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(80,0,0,.3);
}

.letter-content {
    display: none;
    text-align: left;
    font-family: Georgia, serif;
    line-height: 1.8;
}

.envelope.open .letter-content {
    display: block;
    animation: letterReveal 1s ease;
}

.envelope.open .wax-seal {
    display: none;
}

@keyframes letterReveal {
    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.letter-content h2 {
    text-align: center;
    color: #6f1522;
    margin-bottom: 25px;
}

.letter-content p {
    margin-bottom: 15px;
}

.letter-content ul {
    padding-left: 25px;
    margin-bottom: 20px;
}

.letter-content li {
    margin-bottom: 5px;
}

/* =========================================================
   SCENE 8 - GIFT
========================================================= */

.final-scene {
    position: relative;
}

.gift {
    width: 210px;
    height: 180px;
    margin: 50px auto 30px;
    position: relative;
    cursor: pointer;
    transition: .5s;
}

.gift:hover {
    transform: translateY(-10px) scale(1.04);
}

.gift-box {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 210px;
    height: 135px;
    background: linear-gradient(
        135deg,
        #b31531,
        #7b0e21
    );
    border-radius: 5px;
    box-shadow: 0 25px 50px rgba(0,0,0,.4);
}

.gift-lid {
    position: absolute;
    width: 230px;
    height: 45px;
    left: -10px;
    top: 35px;
    background: linear-gradient(
        135deg,
        #d21c3d,
        #8b1027
    );
    border-radius: 5px;
    transition: .8s;
    z-index: 3;
}

.gift.open .gift-lid {
    transform: translateY(-100px) rotate(-8deg);
}

.gift-ribbon-v {
    position: absolute;
    width: 35px;
    height: 135px;
    background: #ffd166;
    left: 87px;
    bottom: 0;
    z-index: 2;
}

.gift-ribbon-h {
    position: absolute;
    width: 210px;
    height: 28px;
    background: #ffd166;
    left: 0;
    top: 50px;
    z-index: 4;
}

.gift-bow {
    position: absolute;
    top: 5px;
    left: 70px;
    width: 70px;
    height: 45px;
    z-index: 6;
}

.gift-bow::before,
.gift-bow::after {
    content: "";
    position: absolute;
    width: 50px;
    height: 35px;
    background: #ffd166;
    border-radius: 50% 50% 10% 50%;
}

.gift-bow::before {
    left: 0;
    transform: rotate(25deg);
}

.gift-bow::after {
    right: 0;
    transform: rotate(-25deg);
}

.final-message {
    opacity: 0;
    transform: translateY(20px);
    transition: .7s;
    pointer-events: none;
}

.final-message.show {
    opacity: 1;
    transform: translateY(0);
}

.final-message h2 {
    font-size: clamp(40px, 8vw, 75px);
    color: #ffd166;
}

.final-message p {
    color: #ccc;
    margin-top: 15px;
    font-family: Arial, sans-serif;
}

/* =========================================================
   CONFETTI
========================================================= */

#confetti-container {
    position: fixed;
    inset: 0;
    z-index: 1000;
    pointer-events: none;
    overflow: hidden;
}

.confetti {
    position: absolute;
    top: -30px;
    width: 10px;
    height: 16px;
    animation: fall linear forwards;
}

@keyframes fall {
    to {
        transform:
            translate3d(
                var(--x),
                110vh,
                0
            )
            rotate(
                var(--rotation)
            );
        opacity: 0;
    }
}

/* =========================================================
   FIREWORKS
========================================================= */

.firework {
    position: fixed;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ffd166;
    z-index: 900;
    pointer-events: none;
    animation: firework 1.2s ease-out forwards;
}

@keyframes firework {
    0% {
        transform: scale(1);
        opacity: 1;
        box-shadow:
            0 0 0 0 #ffd166;
    }

    100% {
        transform: scale(30);
        opacity: 0;
        box-shadow:
            0 0 0 20px transparent;
    }
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: min(400px, 70vw);
    height: 4px;
    background: rgba(255,255,255,.1);
    z-index: 500;
    border-radius: 10px;
}

.progress {
    height: 100%;
    width: 12.5%;
    background: #ffd166;
    border-radius: inherit;
    transition: width .6s ease;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    .topbar {
        padding: 0 15px;
    }

    .logo {
        font-size: 13px;
        letter-spacing: 2px;
    }

    .scene {
        padding-top: 70px;
        padding-bottom: 50px;
    }

    .door-area {
        height: 410px;
    }

    .answer-grid {
